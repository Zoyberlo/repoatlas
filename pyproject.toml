[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoatlas"
version = "0.1.0"
description = "A universal, oracle-verified code index for LLM coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Zoyberlo" }]
keywords = ["code-index", "tree-sitter", "scip", "mcp", "llm", "code-search"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
# The evaluation harness deliberately has no runtime dependencies: SCIP is
# decoded from the wire format directly, so the correctness suite runs
# anywhere Python does. Parsing and serving pull their own extras.
dependencies = []

[project.optional-dependencies]
parse = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-language-pack>=1.16",
]
serve = ["mcp>=2.1,<3"]
dev = [
  # `parse` is included so CI actually runs the extractor tests rather than
  # skipping them, which would leave the oracle comparison unverified.
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-language-pack>=1.16",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
repoatlas = "repoatlas.cli:main"

[project.urls]
Homepage = "https://github.com/Zoyberlo/repoatlas"
Issues = "https://github.com/Zoyberlo/repoatlas/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/repoatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "oracle: needs an external indexer (scip-typescript, scip-python, ...) on PATH",
  "slow: takes more than a second",
]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/repoatlas"]
strict = true
warn_unreachable = true
